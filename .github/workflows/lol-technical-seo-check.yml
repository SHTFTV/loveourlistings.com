name: Love Our Listings technical SEO and category checks
on:
  push:
    branches: ['codex/lol-technical-seo']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-source-photo.mjs
      - run: npm run build
      - run: python3 scripts/verify-technical-seo.py
